name: Phase 1 regression checks
on:
  pull_request:
  push:
    branches:
      - fix/v0.5.5-phase1-stability
jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check game.js
      - name: Regression tests
        run: node --test tests/stability.test.cjs
